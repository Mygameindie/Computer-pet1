<!DOCTYPE html>
<html lang="en">

<head>
	<!-- Version tag (?v=...) on every script and stylesheet: bump it after changing
	     any of them, so browsers and GitHub Pages never mix old and new files. -->
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
	<title>My Pet Game</title>
	<link rel="stylesheet" href="pet_style.css?v=20261018n" />
	<link rel="stylesheet" href="scroll.css?v=20261018n">
</head>

<body>
	<canvas id="canvas"></canvas>

	<div id="ui">
		<div id="mode-menu">
			<button id="normal-btn">🧸 Drag</button>
			<button id="feed-btn">🍖 Feed</button>
			<button id="shower-btn">🧽 Shower</button>
			<button id="troll-btn">🧈 Troll</button>
			<button id="karaoke-btn">🎤 Karaoke</button>
			<button id="sleep-btn">😴 Sleep</button>
			<button id="doctor-btn">🩺 Doctor</button>
			<button id="playground-btn">🛝 Playground</button>
			<button id="garden-btn">🌱 Garden</button>
			<button id="confidence-btn">💪 Confidence</button>
		</div>
		<div id="hint" class="card small"></div>
	</div>

	<script src="hd_canvas.js?v=20261018n"></script>
	<script src="asset_path_fix.js?v=20261018n"></script>
	<script src="pet_gender.js?v=20261018n"></script>
	<script src="pet_art.js?v=20261018n"></script>
	<script src="mode_manger.js?v=20261018n"></script>
	<script src="outfit_config.js?v=20261018n"></script>
	<script src="outfit_system_single_sprite.js?v=20261018n"></script>
	<script src="outfit_presets.js?v=20261018n"></script>
	<!-- Ragdoll: the skeleton + physics (ported from Computer-pet) -->
	<script src="ragdoll_config.js?v=20261018n"></script>
	<script src="ragdoll.js?v=20261018n"></script>
	<script src="pet_stats.js?v=20261018n"></script>
	<script src="pet_modes.js?v=20261018n"></script>
	<script src="canvas_fix.js?v=20261018n"></script>

	<script src="pet_toys.js?v=20261018n"></script>

</html>
