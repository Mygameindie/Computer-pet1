# ===========================================================
#  Build the Windows app
# ===========================================================
# Produces a real .exe with Electron packaged inside it, so people who just
# want the pet don't need Node.js, don't need npm install, and don't need to
# extract anything. Two files come out of a run:
#
#   DesktopPet-Portable-<version>.exe   one file, double-click it, pet appears
#   Desktop Pet Single Setup <ver>.exe  installer, adds a Start Menu entry
#
# Two ways to run it:
#   * Actions tab -> "Build Windows app" -> Run workflow. The .exe files land
#     in the run's Artifacts (GitHub zips artifacts - that's its own doing).
#   * Push a tag starting with v (git tag v1.0.0 && git push origin v1.0.0).
#     That also publishes a Release with the .exe files attached as direct
#     downloads - no zip, which is what you want people clicking on.
# ===========================================================

name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      # --publish never: electron-builder tries to upload to a GitHub release
      # by itself on a tag build. The release step below does that, so this
      # keeps the two from racing each other.
      - name: Build
        run: npm run build:win -- --publish never

      - name: Upload the .exe files
        uses: actions/upload-artifact@v4
        with:
          name: desktop-pet-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exes = Get-ChildItem -Path dist -Filter *.exe | ForEach-Object { $_.FullName }
          if (-not $exes) { throw "No .exe was built." }
          gh release create $env:GITHUB_REF_NAME @exes `
            --title "Desktop Pet $env:GITHUB_REF_NAME" `
            --notes "Download an .exe below and run it. Node.js is not needed."
