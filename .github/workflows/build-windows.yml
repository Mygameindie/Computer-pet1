# ===========================================================
#  Build the Windows app
# ===========================================================
# Produces a real .exe with Electron packaged inside it, so people who just
# want the pet don't need Node.js, don't need npm install, and don't need to
# extract anything. One file comes out of a run:
#
#   DesktopPet-<version>.exe   double-click it, the pet appears
#
# Deliberately NOT an installer: nothing to install, nothing in the Start Menu,
# nothing to uninstall. Keep the file wherever you like, delete it when done.
#
# Two ways to run it:
#   * Actions tab -> "Build Windows app" -> Run workflow. The .exe files land
#     in the run's Artifacts (GitHub zips artifacts - that's its own doing).
#   * Push a tag starting with v (git tag v1.0.0 && git push origin v1.0.0).
#     That also publishes a Release with the .exe attached as a direct
#     download - no zip, which is what you want people clicking on.
# ===========================================================

name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      # --publish never: electron-builder tries to upload to a GitHub release
      # by itself on a tag build. The release step below does that, so this
      # keeps the two from racing each other.
      - name: Build
        run: npm run build:win -- --publish never

      - name: Upload the .exe files
        uses: actions/upload-artifact@v4
        with:
          name: desktop-pet-windows
          path: dist/*.exe
          if-no-files-found: error

      # Works whichever way the tag was made: pushed from a terminal (no release
      # exists yet, so make one) or created by the Releases page on the website
      # (the release is already there, so just attach the .exe to it).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exes = Get-ChildItem -Path dist -Filter *.exe | ForEach-Object { $_.FullName }
          if (-not $exes) { throw "No .exe was built." }

          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists - attaching the .exe to it."
            gh release upload $tag @exes --clobber
          } else {
            Write-Host "Creating release $tag."
            gh release create $tag @exes `
              --title "Desktop Pet $tag" `
              --notes "Download the .exe below and run it. Node.js is not needed."
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing the release failed." }
